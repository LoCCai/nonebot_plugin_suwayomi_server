[project]
name = "nonebot_plugin_suwayomi_server"
version = "0.8.2"
description = "📖 Suwayomi 漫画助手 — 基于 Suwayomi-Server 的 NoneBot2 漫画搜索、阅读、下载与订阅推送插件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "LoCCai" }]
keywords = ["nonebot", "nonebot2", "suwayomi", "manga", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "aiohttp>=3.9.0",
    "img2pdf>=0.5.0",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0.0",
    "pydantic>=2.0,<3",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# 系统卡片渲染（HTML → 图片），未安装时指令结果自动回退纯文本
cards = ["nonebot-plugin-htmlrender>=0.7.2"]
all = ["nonebot-plugin-htmlrender>=0.7.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "nonebot2[fastapi]>=2.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/LoCCai/nonebot_plugin_suwayomi_server"
Documentation = "https://github.com/LoCCai/nonebot_plugin_suwayomi_server#readme"
Source = "https://github.com/LoCCai/nonebot_plugin_suwayomi_server"

[project.entry-points.nonebot]
nonebot_plugin_suwayomi_server = "nonebot_plugin_suwayomi_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_suwayomi_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
